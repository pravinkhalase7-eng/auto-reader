# Production / VPS docker-compose for AI Teacher
# Used by Jenkinsfile (same pattern as Option-Trading / NiftySense).

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiteacher-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiteacher}
      POSTGRES_DB: ${POSTGRES_DB:-aiteacher}
    volumes:
      - aiteacher_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiteacher} -d ${POSTGRES_DB:-aiteacher}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - aiteacher

  redis:
    image: redis:7-alpine
    container_name: aiteacher-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - aiteacher

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: aiteacher-api:${IMAGE_TAG:-latest}
    container_name: aiteacher-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - aiteacher_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 35s
    networks:
      - aiteacher

  celery-worker:
    image: aiteacher-api:${IMAGE_TAG:-latest}
    container_name: aiteacher-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - aiteacher_storage:/app/storage
    networks:
      - aiteacher

  celery-beat:
    image: aiteacher-api:${IMAGE_TAG:-latest}
    container_name: aiteacher-celery-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - aiteacher_storage:/app/storage
    networks:
      - aiteacher

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    image: aiteacher-web:${IMAGE_TAG:-latest}
    container_name: aiteacher-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Browser calls this URL — must be reachable from the user's machine/VPS public host
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    networks:
      - aiteacher

volumes:
  aiteacher_pgdata:
    name: aiteacher_pgdata
  aiteacher_storage:
    name: aiteacher_storage

networks:
  aiteacher:
    name: aiteacher_net
