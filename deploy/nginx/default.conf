# AI Teacher — public reverse proxy (HTTP)
# /        → Next.js web
# /api/    → FastAPI
# Included from /etc/nginx/conf.d/ (http context).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream aiteacher_web {
    server web:3000;
}

upstream aiteacher_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # API (same-origin when UI uses http://doxstation.com/api/v1)
    location /api/ {
        proxy_pass http://aiteacher_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next.js UI (+ _next assets)
    location / {
        proxy_pass http://aiteacher_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
